name: Chapter 5 CI Tests

on:
  push:
    paths:
      - 'Chapter5/**'
  pull_request:
    paths:
      - 'Chapter5/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r Chapter5/SimpleChatAgent/AganticAssistant/requirements.txt
      - name: Run Chapter 5 tests
        working-directory: Chapter5/SimpleChatAgent
        run: pytest tests
